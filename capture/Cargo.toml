[package]
name = "amaterasu-capture-vkms"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Desktop geometry from the compositor's wl_output/xdg-output layout. Needs
# wayland-client development files and wayland-scanner at build time.
linux-kwin-geometry = []
# Copies mutable compositor frames into immutable render-node allocations.
linux-gpu-snapshot = []

[dependencies]
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk", rev = "a3268d5db84bee3ae5181aae327d8e0bfab3fbb5" }
amaterasu-media = { git = "https://github.com/nonary-streams/amaterasu-sdk", rev = "a3268d5db84bee3ae5181aae327d8e0bfab3fbb5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Shared wire protocol and descriptor channel; the privileged code is only in
# the helper binary, not in this library.
amaterasu-vkms-frame-helper = { path = "../helper-wire" }

# libc is already in the workspace lock; it provides the DRM mode-object
# ioctls, fstat and the spawn-time descriptor setup.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
